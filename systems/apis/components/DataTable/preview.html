<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DataTable</title>
<style>
body{margin:0;padding:16px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:720px}
.muted{margin:0;color:var(--ink-muted)}
.icons{gap:16px;color:var(--ink)}
</style>
</head>
<body class="ap-base">
<div id="root"></div>
<script>
  var A = window.Apis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h(A.DataTable,{caption:'October 2026 invoices',columns:[
  {key:'num',label:'Number',nowrap:true},{key:'client',label:'Client'},{key:'due',label:'Due date',nowrap:true},
  {key:'status',label:'Status',render:function(v){return h(A.Badge,{tone:v[0],icon:true},v[1]);}},
  {key:'amount',label:'Amount',numeric:true}],
 rows:[
  {id:1,num:'2026-116',client:'Rossi SA',due:'15 Oct 2026',status:['success','Paid'],amount:"CHF 4'200.00"},
  {id:2,num:'2026-117',client:'Bernasconi Beekeeping',due:'20 Oct 2026',status:['warning','Due soon'],amount:"CHF 1'860.50"},
  {id:3,num:'2026-118',client:'City of Lugano',due:'28 Sep 2026',status:['danger','Overdue'],amount:"CHF 12'480.00"}]})
  ));
</script>
</body>
</html>
