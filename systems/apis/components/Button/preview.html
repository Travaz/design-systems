<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Button</title>
<style>
body{margin:0;padding:16px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:720px}
.muted{margin:0;color:var(--ink-muted)}
.icons{gap:16px;color:var(--ink)}
</style>
</head>
<body class="ap-base">
<div id="root"></div>
<script>
  var A = window.Apis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'row'},
  h(A.Button,{variant:'primary',iconEnd:'arrow-right'},'Inizia un progetto'),
  h(A.Button,null,'Vedi i casi studio'),
  h(A.Button,{variant:'tertiary'},'Annulla'),
  h(A.Button,{variant:'danger'},'Elimina progetto')),
h('div',{className:'row'},
  h(A.Button,{variant:'primary',size:'sm',iconStart:'plus'},'Nuova fattura'),
  h(A.Button,{size:'sm',iconStart:'download'},'Esporta CSV'),
  h(A.Button,{variant:'primary',size:'sm',loading:true},'Salvataggio'),
  h(A.Button,{size:'sm',disabled:true},'Non disponibile'))
  ));
</script>
</body>
</html>
