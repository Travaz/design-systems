<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Alert</title>
<style>
body{margin:0;padding:16px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:720px}
.muted{margin:0;color:var(--ink-muted)}
.icons{gap:16px;color:var(--ink)}
</style>
</head>
<body class="ap-base">
<div id="root"></div>
<script>
  var A = window.Apis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'stack'},
  h(A.Alert,{tone:'info',title:'Il report mensile è pronto.'},'Lo trovi in Report → Ottobre 2026.'),
  h(A.Alert,{tone:'success',title:'Fattura 2026-118 inviata a Rossi SA.'}),
  h(A.Alert,{tone:'warning',title:'Il certificato TLS scade tra 6 giorni.',action:h(A.Button,{size:'sm'},'Rinnova')},'Dopo la scadenza il sito non sarà raggiungibile.'),
  h(A.Alert,{tone:'danger',title:'La sincronizzazione si è fermata alle 14:30.',action:h(A.Button,{size:'sm'},'Riprova')},'Controlla le credenziali di SAP e riprova.'))
  ));
</script>
</body>
</html>
