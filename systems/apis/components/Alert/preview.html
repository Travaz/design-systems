<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert</title>
<style>
body{margin:0;padding:16px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:720px}
.muted{margin:0;color:var(--ink-muted)}
.icons{gap:16px;color:var(--ink)}
</style>
</head>
<body class="ap-base">
<div id="root"></div>
<script>
  var A = window.Apis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'stack'},
  h(A.Alert,{tone:'info',title:'The monthly report is ready.'},'You can find it in Reports → October 2026.'),
  h(A.Alert,{tone:'success',title:'Invoice 2026-118 sent to Rossi SA.'}),
  h(A.Alert,{tone:'warning',title:'The TLS certificate expires in 6 days.',action:h(A.Button,{size:'sm'},'Renew')},'After it expires the site will not be reachable.'),
  h(A.Alert,{tone:'danger',title:'Sync stopped at 14:30.',action:h(A.Button,{size:'sm'},'Try again')},'Check the SAP credentials and try again.'))
  ));
</script>
</body>
</html>
