<!-- @dsCard group="Containers" height=260 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card</title>
<style>
body{margin:0;padding:16px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:720px}
.muted{margin:0;color:var(--ink-muted)}
.icons{gap:16px;color:var(--ink)}
</style>
</head>
<body class="ap-base">
<div id="root"></div>
<script>
  var A = window.Apis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'cards'},
  h(A.Card,{eyebrow:'Case study',title:'A management system for 40 Ticino beekeepers',href:'#',footer:h(A.Badge,{tone:'accent'},'New')},'Batch traceability from comb to jar, in three months.'),
  h(A.Card,{eyebrow:'Internal tool',title:'Hours and invoices',footer:[h(A.Button,{key:1,size:'sm',variant:'primary'},'Open'),h(A.Button,{key:2,size:'sm',variant:'tertiary'},'Details')]},'12 active projects, 3 invoices to issue.'))
  ));
</script>
</body>
</html>
