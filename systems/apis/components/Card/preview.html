<!-- @dsCard group="Contenitori" height=260 -->
<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Card</title>
<style>
body{margin:0;padding:16px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:720px}
.muted{margin:0;color:var(--ink-muted)}
.icons{gap:16px;color:var(--ink)}
</style>
</head>
<body class="ap-base">
<div id="root"></div>
<script>
  var A = window.Apis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'cards'},
  h(A.Card,{eyebrow:'Caso studio',title:'Un gestionale per 40 apicoltori ticinesi',href:'#',footer:h(A.Badge,{tone:'accent'},'Nuovo')},'Tracciabilità dei lotti dal favo al vasetto, in tre mesi.'),
  h(A.Card,{eyebrow:'App interna',title:'Ore e fatture',footer:[h(A.Button,{key:1,size:'sm',variant:'primary'},'Apri'),h(A.Button,{key:2,size:'sm',variant:'tertiary'},'Dettagli')]},'12 progetti attivi, 3 fatture da emettere.'))
  ));
</script>
</body>
</html>
